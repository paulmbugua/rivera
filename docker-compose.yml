services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rivera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rivera
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [rivera_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivera -d rivera"]
      interval: 5s
      retries: 10
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["pnpm", "--dir", "apps/api", "prisma:deploy"]
    environment:
      DATABASE_URL: postgresql://rivera:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rivera?schema=public
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://rivera:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rivera?schema=public
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      EMAIL_VERIFICATION_EXPIRES_IN: ${EMAIL_VERIFICATION_EXPIRES_IN:-24h}
      PASSWORD_RESET_EXPIRES_IN: ${PASSWORD_RESET_EXPIRES_IN:-1h}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Rivera}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@rivera.local}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STORAGE_PROVIDER: local
      LOCAL_UPLOAD_DIR: /app/uploads
      PRIVATE_UPLOAD_DIR: /app/private-uploads
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:4000/media}
      MAX_PROFILE_IMAGE_MB: ${MAX_PROFILE_IMAGE_MB:-5}
      MAX_COVER_IMAGE_MB: ${MAX_COVER_IMAGE_MB:-10}
      MAX_PORTFOLIO_IMAGE_MB: ${MAX_PORTFOLIO_IMAGE_MB:-10}
      MAX_DELIVERABLE_FILE_MB: ${MAX_DELIVERABLE_FILE_MB:-25}
      MARKETPLACE_SERVICE_FEE_BPS: ${MARKETPLACE_SERVICE_FEE_BPS:-1000}
      MARKETPLACE_SERVICE_FEE_FIXED_MINOR: ${MARKETPLACE_SERVICE_FEE_FIXED_MINOR:-0}
      MARKETPLACE_SERVICE_FEE_POLICY: ${MARKETPLACE_SERVICE_FEE_POLICY:-BUSINESS_PAYS_ON_TOP}
      AUTO_RELEASE_ENABLED: ${AUTO_RELEASE_ENABLED:-false}
      AUTO_RELEASE_DELAY_HOURS: ${AUTO_RELEASE_DELAY_HOURS:-72}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-300}
      COLLABORATION_FUNDING_DEADLINE_HOURS: ${COLLABORATION_FUNDING_DEADLINE_HOURS:-48}
      ERROR_MONITORING_ENABLED: ${ERROR_MONITORING_ENABLED:-false}
      ERROR_MONITORING_DSN: ${ERROR_MONITORING_DSN:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@rivera.local}
      CAMPAIGN_REVIEW_REQUIRED: ${CAMPAIGN_REVIEW_REQUIRED:-false}
      MAX_CAMPAIGN_CATEGORIES: ${MAX_CAMPAIGN_CATEGORIES:-5}
      MAX_CAMPAIGN_DELIVERABLES: ${MAX_CAMPAIGN_DELIVERABLES:-20}
      MAX_CAMPAIGN_ATTACHMENTS: ${MAX_CAMPAIGN_ATTACHMENTS:-5}
      MAX_CAMPAIGN_ATTACHMENT_MB: ${MAX_CAMPAIGN_ATTACHMENT_MB:-10}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_APPLICATION_FEE_ENABLED: ${STRIPE_APPLICATION_FEE_ENABLED:-true}
      DEFAULT_APPLICATION_FEE_MINOR: ${DEFAULT_APPLICATION_FEE_MINOR:-300}
      DEFAULT_APPLICATION_FEE_CURRENCY: ${DEFAULT_APPLICATION_FEE_CURRENCY:-USD}
      NEW_CREATOR_FREE_APPLICATIONS: ${NEW_CREATOR_FREE_APPLICATIONS:-3}
      APPLICATION_PAYMENT_EXPIRY_MINUTES: ${APPLICATION_PAYMENT_EXPIRY_MINUTES:-30}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@rivera.local}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-RiveraDemo123}
      BUSINESS_SEED_EMAIL: ${BUSINESS_SEED_EMAIL:-business.demo@example.com}
      BUSINESS_SEED_PASSWORD: ${BUSINESS_SEED_PASSWORD:-RiveraDemo123}
      CREATOR_SEED_EMAIL: ${CREATOR_SEED_EMAIL:-creator.demo@example.com}
      CREATOR_SEED_PASSWORD: ${CREATOR_SEED_PASSWORD:-RiveraDemo123}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID_WEB: ${GOOGLE_CLIENT_ID_WEB:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/api/v1/auth/google/callback}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      NODE_ENV: development
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      [rivera_uploads:/app/uploads, rivera_private_uploads:/app/private-uploads]
    depends_on:
      {
        postgres: { condition: service_healthy },
        migrate: { condition: service_completed_successfully },
      }
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      API_INTERNAL_URL: http://api:4000/api/v1
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      XDG_CONFIG_HOME: /tmp/rivera-sites-runtime/config
      GOOGLE_AUTH_API_URL: ${GOOGLE_AUTH_API_URL:-http://localhost:4000/api/v1}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  rivera_pg:
  rivera_uploads:
  rivera_private_uploads:
