packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  fsevents: false
  prisma: true
  sharp: true
  unrs-resolver: false
  workerd: true
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
packageImportMethod: clone-or-copy
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
