packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  '@babel/core': 7.29.6
  baseline-browser-mapping: 2.11.0
  browserslist: 4.28.7
  deepmerge-ts: 8.0.0
  'miniflare>sharp': 0.35.4
allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  fsevents: false
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: false
  workerd: true
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
packageImportMethod: clone-or-copy
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
