services:
  api:
    environment:
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-admin.json
      PUSH_NOTIFICATIONS_ENABLED: "true"
    volumes:
      - ./secrets/firebase-admin.json:/run/secrets/firebase-admin.json:ro

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - rivera_caddy_data:/data
      - rivera_caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  rivera_caddy_data:
  rivera_caddy_config:
